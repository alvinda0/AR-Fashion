name: ar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera and permissions
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  # UI and utilities
  provider: ^6.1.2
  path_provider: ^2.1.3

  # Vector math for 3D calculations
  vector_math: ^2.1.4

  # ML Kit for pose detection
  google_ml_kit: ^0.18.0

  # 3D model rendering
  model_viewer_plus: ^1.7.2

  # File picker for uploading models
  file_picker: ^8.1.6

  # Shared preferences for storing model paths
  shared_preferences: ^2.3.4

  # Supabase for cloud storage and database
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/glb/